<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>LED DISPLAY</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="display">

  <!-- VIDEO LAYERS -->
  <video id="videoIdle" src="/videos/idle.mp4" autoplay loop muted></video>
  <video id="videoCountdown" src="/videos/countdown.mp4" muted></video>
  <video id="videoNext" src="/videos/next.mp4" muted></video>

  <!-- HANDS -->
  <div class="hands">
    <div class="hand" data-id="1">✋</div>
    <div class="hand" data-id="2">✋</div>
    <div class="hand" data-id="3">✋</div>
    <div class="hand" data-id="4">✋</div>
    <div class="hand" data-id="5">✋</div>
    <div class="hand" data-id="6">✋</div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/script.js"></script>
</body>
</html>
